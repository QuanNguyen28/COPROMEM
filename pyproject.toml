[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "copromem"
version = "0.1.0"
description = "Executable counterfactual procedural contracts for multi-agent handoffs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
copromem-demo = "copromem.experiment:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
